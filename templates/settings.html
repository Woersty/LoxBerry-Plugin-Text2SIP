					var DEBUG = false;  // true = verbose console output


					function updateMqttUi() {
					  var pluginOn = ($('#PLUGIN_USE').val() || 'off').toLowerCase() === 'on';
					  var t2sOn    = ($('#T2S_USE').val() || 'off').toLowerCase() === 'on';
					  var remote   = ($('#MQTT_MODE').val() || 'local') === 'remote';
					  var mqttOn   = pluginOn && t2sOn;
					  var $panel   = $('.t2sip-panel-mqtt');

					  // Panel selbst bleibt sichtbar; Überschrift und Inhalt nur bei beiden Schaltern = ON.
					  $panel.toggleClass('mqtt-content-hidden', !mqttOn);
					  if (!mqttOn) return;

					  // Beim internen Broker werden keine manuellen Verbindungsdaten benötigt.
					  $('.mqtt-remote-fields').toggleClass('mqtt-hidden', !remote);
					  $('.mqtt-local-hint').toggleClass('mqtt-hidden', remote);
					}

					$(document).on('change', '#PLUGIN_USE, #T2S_USE, #MQTT_MODE', updateMqttUi);

					var mqttValidationMessageTimer = null;

					function clearMqttHostValidation() {
					  var $host = $('#MQTT_HOST');
					  $host.removeClass('mqtt-validation-error').removeAttr('aria-invalid');
					  $host.closest('.ui-input-text').removeClass('mqtt-validation-error');
					}

					function hideMqttValidationMessage() {
					  if (mqttValidationMessageTimer !== null) {
					    window.clearTimeout(mqttValidationMessageTimer);
					    mqttValidationMessageTimer = null;
					  }
					  $('#mqtt-validation-message').hide();
					}

					function showMqttValidationMessage() {
					  var $message = $('#mqtt-validation-message');
					  if (mqttValidationMessageTimer !== null) {
					    window.clearTimeout(mqttValidationMessageTimer);
					  }
					  $message.show();
					  mqttValidationMessageTimer = window.setTimeout(function() {
					    $message.hide();
					    mqttValidationMessageTimer = null;
					  }, 5000);
					}

					function markMqttHostInvalid() {
					  var $host = $('#MQTT_HOST');
					  $host.addClass('mqtt-validation-error').attr('aria-invalid', 'true');
					  $host.closest('.ui-input-text').addClass('mqtt-validation-error');
					  showMqttValidationMessage();
					  window.setTimeout(function() {
					    $host.trigger('focus');
					  }, 0);
					}

					function externalMqttValidationRequired() {

                    function CheckConfig(save,message,title)
					{
						clearMqttHostValidation();

						if (!externalMqttValidationRequired()) {
							hideMqttValidationMessage();
							continueCheckConfig(save, message, title);
							return false;
						}

						var host = $.trim($('#MQTT_HOST').val() || '');
						var port = $.trim($('#MQTT_PORT').val() || '') || '1883';

						if (!host) {
							markMqttHostInvalid();
							return false;
						}

						$.ajax({
							type: "POST",
							dataType: "json",
							url: "./index.cgi?do=check_mqtt_endpoint",
							data: {
								MQTT_HOST: host,
								MQTT_PORT: port
							},
							cache: false,
							timeout: 5000
						}).done(function(data) {
							if (data && Number(data.ok) === 1) {
								hideMqttValidationMessage();
								continueCheckConfig(save, message, title);
							} else {
								markMqttHostInvalid();
							}
						}).fail(function() {
							markMqttHostInvalid();
						});

						return false;
					};

					function continueCheckConfig(save,message,title)
					{
						$('#save_data').val('1');

						// Unlock disabled fields so serializeArray() includes them
						$('#main_form input:disabled, #main_form select:disabled, #main_form textarea:disabled')
							.prop('disabled', false);

						$('#dialog').html(message)
						.prop('id','dialog')
						.dialog({
						  modal: true, title: title, zIndex: 10000, autoOpen: true, resizable: true,
						  dialogClass: 'fixedDialog',
						  width: 'auto', height: 'auto', minWidth: '410', minHeight: '230',
						  buttons: {
							'<!--$TXT_BTN_SAVE_CFG_DIALOG_CLOSE-->': function () {
							  $('#dialog').dialog("close");
							}
						  },
						  close: function (event, ui) { $(this).hide(); },
						  open: function (event, ui) {

							$('#dialog').html('<center><br/><br/><div class="spinner"><div class="rect1"></div><div class="rect2"></div><div class="rect3"></div><div class="rect4"></div></div><!--$TXT_PLEASE_WAIT--><br/><br/><br/>');

							$.ajax({
							  type: "POST",
							  dataType: "text",
							  url: "./index.cgi?do=check_config",
							  data: $('#main_form').serializeArray(),
							  cache: false,
							  success: function(data) {
								if ($.trim(data) === '__MQTT_ENDPOINT_UNREACHABLE__') {
								  $('#dialog').dialog("close");
								  markMqttHostInvalid();
								  return;
								}
								$('#dialog').html('<center><br/>'+data+'<br/><br/></center>');
							  }
							}).fail(function() {
							  $('#dialog').html('<center><br/><!--$TXT_SAVE_CFG_DIALOG_FAIL--><br/><br/></center>');
							});
						  }
						});

						$('.ui-button:contains("<!--$TXT_BTN_SAVE-->")').click();
					};

                    /* Konfiguration importieren: Datei unveraendert an das CGI senden.
                       Als Text gelesen wuerde eine aeltere ISO-8859-1-Datei verfaelscht. */
                    function ConfigImport(input)
                    {
                            if (!input.files || !input.files[0]) { return; }
                            if (!confirm('<!--$TXT_CONFIG_IMPORT_CONFIRM-->')) { input.value = ''; return; }
                            var fd = new FormData();
                            fd.append('do', 'config_import');
                            fd.append('cfgfile', input.files[0]);
                            $.ajax(
                            {
                                    url: "index.cgi", type: "POST", data: fd,
                                    processData: false, contentType: false,
                                    dataType: "json", timeout: 30000,
                                    success: function (d)
                                    {
                                            alert(d && d.ok ? '<!--$TXT_CONFIG_IMPORT_OK-->'
                                                            : '<!--$TXT_CONFIG_IMPORT_FAILED-->\n\n' + (d ? d.msg : ''));
                                            if (d && d.ok) { location.reload(); }
                                    },
                                    error: function () { alert('<!--$TXT_CONFIG_IMPORT_FAILED-->'); }
                            });
                            input.value = '';
                    }

                    function play(vg_id_to_play)
                    {
                            $.ajax(
                            {
                              type: "POST",
                              dataType: "text",
                              url: "./index.cgi?do=makecall&vg="+vg_id_to_play,
                              data: $('#main_form').serializeArray(),
                              cache: false,
                              success: function(data)
                              {
                                $('#call_result'+vg_id_to_play).html(data);
                                $('#call_result'+vg_id_to_play).fadeTo( "slow", 1 );
                              }
                            }).fail(function()
                            {
                              $('#call_result'+vg_id_to_play).html('<!--$TXT_JOB_QUEUED_FAIL-->');
                              $('#call_result'+vg_id_to_play).removeClass( 'test2sip_job_ok' ).addClass( 'test2sip_job_failed' );
                              $('#call_result'+vg_id_to_play).fadeTo( "slow", 1 );
                             });
                            setTimeout( function()
                            {
                              $('#call_result'+vg_id_to_play).fadeTo( "slow", 0 );
                          }, 5000);
                    }
					
					/*
					 * fieldControl.js – Simple field show/hide control for Text2SIP / Text2Speech
					 * Compatible with jQuery Mobile
					 */
					function fieldControl() {
					  var pluginUse    = ($('#PLUGIN_USE').val() || '').toLowerCase();
					  var t2sUse       = ($('#T2S_USE').val() || '').toLowerCase();
					  var mqttMode     = ($('#MQTT_MODE').val() || 'local').toLowerCase();
					  var t2sInstalled = ($('#T2S_INSTALLED').val() || '').toLowerCase();

					  if (t2sInstalled === '1') t2sInstalled = 'true';
					  if (t2sInstalled === '0') t2sInstalled = 'false';

					  updateMqttUi();

					  if (DEBUG) {
						console.log("PLUGIN_USE    =", pluginUse);
						console.log("T2S_USE       =", t2sUse);
						console.log("MQTT_MODE     =", mqttMode);
						console.log("T2S_INSTALLED =", t2sInstalled);
					  }

					  if (pluginUse !== 'on') {
						$('.t2s_block').hide();
						$('.field_t2s_not_installed').hide();
						lockLangPickerAll(false);
						return;
					  }

					  $('.t2s_block').show();

					  // Local Text2Speech is required only when the internal broker is used.
					  // External mode talks directly to the configured remote broker.
					  var showLocalT2sHint = (
						t2sUse === 'on' &&
						mqttMode !== 'remote' &&
						t2sInstalled !== 'true'
					  );
					  $('.field_t2s_not_installed').toggle(showLocalT2sHint);

					  lockLangPickerAll(t2sUse === 'on');
					}


					/* ============================================================
					 * P2W_lang Felder sperren/freigeben – kompatibel mit jQM & countrySelect
					 * ============================================================ */
					function lockLangPickerAll(lock){
					  // --- jQM <select> (P2W_langX) ---
					  $("select[id^='P2W_lang']").each(function(){
						var $el = $(this);

						// weiches visuelles Umschalten
						if (lock) {
						  $el.closest('tr, div').stop(true,true).fadeTo(300, 0.4);
						} else {
						  $el.closest('tr, div').stop(true,true).fadeTo(300, 1);
						}

						// Logik zum Sperren
						if ($el.data("mobile-selectmenu")) {
						  $el.selectmenu(lock ? "disable" : "enable").selectmenu("refresh");
						} else {
						  $el.prop("disabled", lock);
						}
					  });

					  // --- countrySelect <input> (falls noch vorhanden) ---
					  $("input[id^='P2W_lang']").each(function(){
						var $inp  = $(this);
						var $ui   = $inp.closest(".ui-input-text");
						var $wrap = $inp.closest(".country-select");

						// sanft aus-/einblenden
						if (lock) {
						  $wrap.stop(true,true).fadeTo(300, 0.4);
						} else {
						  $wrap.stop(true,true).fadeTo(300, 1);
						}

						$inp.prop("readonly", lock).prop("disabled", lock);
						if (lock) { $inp.attr("tabindex","-1"); } else { $inp.removeAttr("tabindex"); }

						if ($ui.length) $ui.toggleClass("ui-disabled ui-state-disabled", lock);

						if ($wrap.length){
						  if ($wrap.css("position")==="static") $wrap.css("position","relative");
						  if (lock){
							$wrap.find(".country-list:visible").hide();
							if (!$wrap.find(".cs-blocker").length){
							  $wrap.append('<div class="cs-blocker" style="position:absolute;inset:0;z-index:9999;background:transparent;cursor:not-allowed;"></div>');
							}
						  } else {
							$wrap.find(".cs-blocker").remove();
						  }
						}
					  });

					  // Retry nach kurzem Delay (falls jQM Selects erst danach enhanced)
					  clearTimeout(window.__p2wRetry);
					  window.__p2wRetry = setTimeout(function(){
						$("select[id^='P2W_lang']").each(function(){
						  var $el = $(this);
						  if ($el.data("mobile-selectmenu")){
							$el.selectmenu(lock ? "disable" : "enable").selectmenu("refresh");
						  }
						});
					  }, 300);

					  console.log("P2W_lang Fields " + (lock ? "locked (faded out)" : "unlocked (faded in)"));
					}
